<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Memory Box</title>
<style>
/* The whole page is the void. Icons only; no words on screen. */
:root{ --fluo:#7ff6e6; --line:rgba(200,255,245,.28); }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#e8fffb;overflow:hidden;overscroll-behavior:none;font-family:system-ui,sans-serif}
#stage{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100% !important;height:100% !important}
.top{position:fixed;right:0;top:0;z-index:5;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.35);color:#e8fffb;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:.75;transition:opacity .3s}
.icon-btn:hover{opacity:1}
.icon-btn svg{width:18px;height:18px}
.icon-btn:focus-visible{outline:2px solid var(--fluo);outline-offset:3px}
.hints{position:fixed;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:center;gap:34px;pointer-events:none;opacity:0;transition:opacity 1.4s}
.hints.on{opacity:.8}
.hints svg{width:30px;height:30px;stroke:#e8fffb;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(127,246,230,.6))}
.fail{position:fixed;inset:0;display:grid;place-items:center;color:#9fb;font-size:14px;padding:24px;text-align:center}
@media (prefers-reduced-motion: reduce){.hints{transition:none}}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage" role="img" aria-label="Memories of friends floating in a dark void, lit one by one by a glowing light"></div>
<div class="top">
  <button id="snd" class="icon-btn" aria-label="Sound" aria-pressed="false">
    <svg id="sndOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
    <svg id="sndOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  </button>
</div>
<div class="hints" id="hints" aria-hidden="true">
  <!-- drag to look -->
  <svg viewBox="0 0 32 32"><path d="M8 16h16M8 16l3-3M8 16l3 3M24 16l-3-3M24 16l-3 3"/><circle cx="16" cy="16" r="2.2"/></svg>
  <!-- tap a memory -->
  <svg viewBox="0 0 32 32"><circle cx="16" cy="13" r="3"/><circle cx="16" cy="13" r="7.5" opacity=".55"/><path d="M16 21v6"/></svg>
</div>
<noscript><div class="fail">This memory needs JavaScript.</div></noscript>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = (id) => document.getElementById(id);
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const V3 = THREE.Vector3;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const seg = (t, a, d) => clamp((t - a) / d, 0, 1);
const ease = (x) => x * x * (3 - 2 * x);
const easeIO = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const now = () => performance.now() / 1000;

/* ===================== renderer ===================== */
const stage = $('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  stage.innerHTML = '<div class="fail">This device cannot show 3D right now.</div>';
  throw e;
}
const DPR = Math.min(devicePixelRatio || 1, 1.6);
renderer.setPixelRatio(DPR);
renderer.setClearColor(0x000000, 1);
renderer.toneMapping = THREE.NoToneMapping;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, .02, 400);
const FLUO = new THREE.Color(0x6ff7e4);           // the fluorescent light
const FLUO_LIN = new THREE.Vector3(FLUO.r, FLUO.g, FLUO.b);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), .42, .5, .86);
composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) }, uAspect: { value: 1 },
    uBlob: { value: new THREE.Vector2(.5, .5) }, uBlobV: { value: 0 }, uBlobS: { value: .5 }, uGlass: { value: 1 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uAspect, uBlobV, uBlobS, uGlass; uniform vec2 uRes, uBlob; varying vec2 vUv;
    float hh(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hh(i), hh(i + vec2(1.0, 0.0)), f.x), mix(hh(i + vec2(0.0, 1.0)), hh(i + vec2(1.0, 1.0)), f.x), f.y); }
    float fb(vec2 p){ float s = 0.0, a = .5; for (int i = 0; i < 3; i++){ s += a * vn(p); p = p * 2.07 + vec2(1.7, 9.2); a *= .5; } return s; }
    vec3 spectrum(float x){ return clamp(vec3(abs(x * 6.0 - 3.0) - 1.0, 2.0 - abs(x * 6.0 - 2.0), 2.0 - abs(x * 6.0 - 4.0)), 0.0, 1.0); }
    void main(){
      vec2 uv = vUv, asp = vec2(uAspect, 1.0);
      float t = uTime * .04;
      // a sheet of slowly flowing liquid glass in front of everything
      vec2 q = uv * asp * 1.35;
      float w1 = fb(q + vec2(t, -t * .6));
      float w2 = fb(q * 1.25 + vec2(-t * .7, t * .8) + w1 * 2.2);
      vec2 g = vec2(dFdx(w2), dFdy(w2)) * uRes.y;
      vec2 off = ((vec2(w1, w2) - .5) * .012 + g * .0008) * uGlass;
      float ridge = smoothstep(.035, .0, abs(w2 - .55));
      float disp = (.0015 + ridge * .007) * uGlass;
      vec2 dir = normalize(g + vec2(1e-4, 0.0));
      vec3 col = vec3(texture2D(tDiffuse, uv + off + dir * disp).r, texture2D(tDiffuse, uv + off).g, texture2D(tDiffuse, uv + off - dir * disp).b);
      // rainbow light caught in the glass edges, strongest near the light
      float near = exp(-length((uv - uBlob) * asp) * 2.4) * uBlobV;
      float lum = dot(col, vec3(.3, .5, .2));
      col += spectrum(fract(w1 * 1.7 + uv.x * .4 + t)) * ridge * (lum * .35 + .012 * near) * uGlass;
      col *= 1.0 + (w2 - .5) * .12 * uGlass;            // the glass is thicker in places
      // soft light leaks, like light trapped inside a crystal
      vec2 l1 = vec2(.84 + .08 * sin(t * 2.3), .16 + .07 * cos(t * 1.7)), l2 = vec2(.12 + .06 * cos(t * 1.9), .86 + .05 * sin(t * 2.1));
      col += vec3(.03, .17, .2) * pow(max(0.0, 1.0 - length((uv - l1) * asp) * 1.8), 4.0) * .12 * uGlass;
      col += vec3(.06, .08, .2) * pow(max(0.0, 1.0 - length((uv - l2) * asp) * 2.0), 4.0) * .08 * uGlass;
      if (uBlobV > .01){
        // shafts of light pouring from the orb through the particles
        vec2 dd = (uv - uBlob) / 14.0; vec2 s = uv + off; vec3 acc = vec3(0.0); float wt = 1.0;
        for (int i = 0; i < 14; i++){ s -= dd; acc += max(texture2D(tDiffuse, s).rgb - .75, 0.0) * wt; wt *= .84; }
        col += acc * .02 * uBlobV * exp(-length((uv - uBlob) * asp) * 2.6);
        // the lens catches the light: faint prism ghosts
        vec2 bp = (uv - uBlob) * asp;
        vec2 axis = vec2(.5) - uBlob;
        for (int k = 0; k < 3; k++){
          float fk = float(k); vec2 gp = uBlob + axis * (1.35 + fk * .5); float rk = .028 + fk * .024;
          float dg = length((uv - gp) * asp);
          col += spectrum(.35 + fk * .22) * smoothstep(rk, rk * .7, dg) * (.45 + .55 * smoothstep(rk * .5, rk, dg)) * .012 * uBlobV;
        }
      }
      vec2 d = uv - .5; float r = dot(d, d);
      col *= 1.0 - r * 1.15;                                  // vignette
      vec2 px = floor(vUv * uRes) + floor(fract(uTime * 7.13) * 64.0) * vec2(5.588, 3.17);
      col += (fract(52.9829189 * fract(dot(px, vec2(.06711056, .00583715)))) - .5) * .016;   // film grain
      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }`
});
composer.addPass(grade);
composer.addPass(new OutputPass());

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h);
  bloom.resolution.set(w * DPR / 2, h * DPR / 2);
  grade.uniforms.uRes.value.set(w * DPR, h * DPR); grade.uniforms.uAspect.value = w / h;
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ===================== the void ===================== */
const NOISE = `
  float h3(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  float n3(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z); }
  float fbm(vec3 p){ float a = .5, s = 0.0; for (int i = 0; i < 4; i++){ s += a * n3(p); p = p * 2.03 + 1.7; a *= .5; } return s; }`;

const timeU = { value: 0 };
// a faint nebula, almost black, so the dark has depth
const nebula = new THREE.Mesh(new THREE.SphereGeometry(150, 32, 16), new THREE.ShaderMaterial({
  uniforms: { uTime: timeU }, side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform float uTime; varying vec3 vD; ${NOISE}
    void main(){ vec3 d = normalize(vD);
      float n = fbm(d * 2.4 + vec3(uTime * .004, 0.0, -uTime * .003));
      float m = fbm(d * 5.0 - 3.1);
      vec3 c = mix(vec3(.0006, .0009, .0025), vec3(.004, .010, .016), smoothstep(.45, .85, n));
      c += vec3(.006, .002, .012) * smoothstep(.55, .9, m) * .8;
      gl_FragColor = vec4(c, 1.0); }`
}));
scene.add(nebula);

// drifting dust motes everywhere in the void
const MOTES = 2600;
{
  const p = new Float32Array(MOTES * 3), s = new Float32Array(MOTES);
  for (let i = 0; i < MOTES; i++){ p[i * 3] = (Math.random() - .5) * 70; p[i * 3 + 1] = (Math.random() - .5) * 34; p[i * 3 + 2] = -55 + Math.random() * 80; s[i] = Math.random(); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('seed', new THREE.BufferAttribute(s, 1));
  const m = new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: { uTime: timeU, uPx: { value: 1 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `attribute float seed; uniform float uTime, uPx; varying float vA;
      void main(){ vec3 q = position; q.y += sin(uTime * .1 + seed * 40.0) * .4; q.x += sin(uTime * .07 + seed * 20.0) * .5;
        vec4 mv = modelViewMatrix * vec4(q, 1.0);
        vA = (.25 + .75 * seed) * (.55 + .45 * sin(uTime * (.6 + seed) + seed * 50.0)) * smoothstep(60.0, 8.0, -mv.z);
        gl_PointSize = clamp(uPx * .035 * (.4 + seed) / -mv.z, 0.0, 4.0); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `varying float vA; void main(){ vec2 c = gl_PointCoord - .5; float d = dot(c, c); if (d > .25) discard;
      gl_FragColor = vec4(vec3(.55, .8, .85) * smoothstep(.25, .0, d) * vA * .35, 1.0); }`
  }));
  m.frustumCulled = false; m.userData.isMotes = true; scene.add(m); scene.userData.motes = m;
}

/* ===================== the glowing light ===================== */
function glowTex(){
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.18, 'rgba(255,255,255,.75)'); r.addColorStop(.45, 'rgba(255,255,255,.18)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128); const t = new THREE.CanvasTexture(c); return t;
}
const GLOW = glowTex();
const sprite = (color, s, o) => { const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: o }));
  m.scale.setScalar(s); m.userData.s = s; m.userData.o = o; return m; };
const blob = new THREE.Group(); scene.add(blob);
// the light is three glowing bodies held together by their own gravity (a three-body dance)
const sys = new THREE.Group(); blob.add(sys);
const BODY_K = .32;                                  // simulation units -> world
const TB = {
  // a chaotic but bound start (found by simulating many starts and keeping one that never flies apart)
  p: [new V3(.8467, .0495, -.1134), new V3(-.3571, .6901, .1439), new V3(-.4897, -.7396, -.0305)],
  v: [new V3(-.1739, .5582, .0248), new V3(-.3798, -.1019, -.0399), new V3(.5537, -.4563, .015)],
  a: [new V3(), new V3(), new V3()]
};
function tbAccel(){
  for (let i = 0; i < 3; i++) TB.a[i].copy(TB.p[i]).multiplyScalar(-.06);    // a soft pull to the centre keeps the dance together
  for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++){
    const d = TB.p[j].clone().sub(TB.p[i]), r2 = d.lengthSq() + .02, f = 1 / (r2 * Math.sqrt(r2));
    TB.a[i].addScaledVector(d, f); TB.a[j].addScaledVector(d, -f);
  }
}
tbAccel();
function tbStep(h){
  for (let i = 0; i < 3; i++){ TB.v[i].addScaledVector(TB.a[i], h / 2); TB.p[i].addScaledVector(TB.v[i], h); }
  tbAccel();
  for (let i = 0; i < 3; i++) TB.v[i].addScaledVector(TB.a[i], h / 2);
}
const bodyU = { uTime: timeU, uI: { value: 0 }, uFluo: { value: FLUO_LIN } };
const bodyMat = new THREE.ShaderMaterial({
  uniforms: bodyU, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(0.0, 0.0, 0.0, 1.0);
    mv.xy += position.xy * length(modelViewMatrix[0].xyz); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform float uTime, uI; uniform vec3 uFluo; varying vec2 vUv;
    void main(){
      vec2 p = vUv * 2.0 - 1.0; float r = length(p), R = .26;
      float sphere = smoothstep(R, R - .025, r);
      float limb = sqrt(max(0.0, 1.0 - (r / R) * (r / R)));
      vec3 body = mix(vec3(.45, .85, 1.0), vec3(1.0), pow(limb, .45)) * 1.7;      // white-hot, a blue limb
      float ou = max(r - R, 0.0);
      vec3 glow = mix(vec3(.55, .9, 1.0), uFluo, .4) * (exp(-ou * 10.0) * .7 + .012 / (r * r + .012));
      gl_FragColor = vec4((body * sphere + glow * (1.0 - sphere * .6)) * smoothstep(1.0, .55, r) * uI, 1.0);
    }`
});
const bodies = [0, 1, 2].map(() => { const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), bodyMat); m.scale.setScalar(.46); m.frustumCulled = false; sys.add(m); return m; });
// each body draws a swirl of light behind it, like matter pulled into a disc
const TR = 170;
const trailPos = new Float32Array(3 * TR * 3), trailA = new Float32Array(3 * TR);
const swirlGeo = new THREE.BufferGeometry();
swirlGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3)); swirlGeo.setAttribute('a', new THREE.BufferAttribute(trailA, 1));
const tbHist = [[], [], []]; let tbClock = 0, tbSample = 0;
const pointMat = (sizeK, color) => new THREE.ShaderMaterial({
  uniforms: { uPx: { value: 1 }, uK: { value: sizeK }, uCol: { value: color } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `attribute float a; uniform float uPx, uK; varying float vA;
    void main(){ vA = a; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = clamp(uPx * uK * (.3 + a) / -mv.z, 0.0, 40.0); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform vec3 uCol; varying float vA; void main(){ vec2 c = gl_PointCoord - .5; float d = dot(c, c); if (d > .25) discard;
    gl_FragColor = vec4(uCol * exp(-d * 14.0) * vA, 1.0); }`
});
// embers the light sheds as it moves: they drift, float and wink out
const EMB = 180;
const embGeo = new THREE.BufferGeometry();
embGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(EMB * 3), 3));
embGeo.setAttribute('a', new THREE.BufferAttribute(new Float32Array(EMB), 1));
const swirlCore = new THREE.Points(swirlGeo, pointMat(.011, new THREE.Vector3(.3, .72, 1.05)));
const swirlHaze = new THREE.Points(swirlGeo, pointMat(.1, new THREE.Vector3(.03, .15, .32)));
swirlCore.frustumCulled = swirlHaze.frustumCulled = false; sys.add(swirlHaze, swirlCore);
const embers = new THREE.Points(embGeo, pointMat(.016, new THREE.Vector3(.8, 1.35, 1.25)));
embers.frustumCulled = false; scene.add(embers);
const EP = Array.from({ length: EMB }, () => ({ p: new V3(0, 0, 999), v: new V3(), life: 9, max: 1, s: Math.random() }));
let embAcc = 0, embNext = 0;
const blobPrev = new V3(), blobVel = new V3();
// a comet trail behind the light
const TRAIL = 260;
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL * 3), 3));
trailGeo.setAttribute('a', new THREE.BufferAttribute(new Float32Array(TRAIL), 1));
const trail = new THREE.Points(trailGeo, pointMat(.007, new THREE.Vector3(.3, .95, .9)));
trail.frustumCulled = false; scene.add(trail);
const history = [];

/* ===================== memories ===================== */
// where each memory floats in the void (its people sit at C), and how it is turned
const LAYOUT = [
  { C: [3.8, 7.6, -4.5], yaw: -.3, pitch: .02, roll: -.03 },    // the June trip, the oldest memory (highest)
  { C: [-3.6, 3.9, -8.5], yaw: .36, pitch: .03, roll: .04 },     // mountain viewpoint, day
  { C: [3.9, .2, -12.5], yaw: -.42, pitch: -.04, roll: -.05 },   // misty hilltop
  { C: [-3.4, -3.5, -16.5], yaw: .28, pitch: .05, roll: .05 },   // party under the lights, night
  { C: [3.6, -7.2, -20.5], yaw: -.46, pitch: -.02, roll: -.04 }  // the street, late (deepest)
];
const SCALE = 1.9;                                               // each memory is a little larger than life
const CENTRE = LAYOUT.reduce((a, l) => a.add(new V3(...l.C)), new V3()).multiplyScalar(1 / LAYOUT.length);
// the whole box seen from the front: every memory turns (almost) toward this point
const OVER = { pos: CENTRE.clone().add(new V3(0, 1.2, 22)), look: CENTRE.clone() };

const pointVS = `
  uniform vec3 uLo, uHi, uWaveC, uRipC, uBlob, uFluo;
  uniform float uSmin, uSmax, uPx, uTime, uLevel, uDust, uWaveR, uWaveA, uRipR, uRipA, uBlobA, uFlat, uPlane, uFocus, uAper, uGain, uKeep, uShed, uClear, uMode, uSizeK;
  attribute float aS, aW;
  varying vec3 vC; varying float vBok;
  float hsh(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  void main(){
    vec3 p = uLo + position * (uHi - uLo);
    float h = hsh(position * 613.0), h2 = hsh(position * 271.0 + 3.1), h3 = hsh(position * 997.0 + 7.7);
    vec3 rnd = vec3(h, h2, h3) - .5;
    float d = distance(p, uWaveC);
    float passed = 1.0 - smoothstep(uWaveR - .9, uWaveR, d);          // 1 once the light has reached it
    // before the light arrives, the memory is loose dust drifting in the dark
    vec3 drift = vec3(sin(uTime * .21 + h * 40.0), cos(uTime * .17 + h2 * 31.0), sin(uTime * .13 + h3 * 17.0));
    vec3 scat = normalize(rnd + 1e-4) * (.18 + 1.1 * h2 * h2) + drift * .12;
    float settle = passed * passed * (3.0 - 2.0 * passed);

    look.copy(tmp).lerp(m.C, ease(seg(k, .55, .45)));
    fov = S.fov0 + (Math.max(S.fov1, 46) - S.fov0) * ease(seg(k, 0, .4));
    fov += (S.fov1 - fov) * ease(seg(k, .6, .4));
    if (k >= 1) arrive();
  } else if (S.mode === 'hold'){
    const m = mems[S.idx];
    const dur = m.waveT > 0 && t - m.waveT < HOLD + 1 ? HOLD : REVISIT;
    // a slow push in toward the friends, breathing a little
    const k = easeOut(seg(el, 0, dur));
    basePos.copy(m.view).lerp(m.C, .1 * k);
    tmp.subVectors(m.C, m.view).normalize(); tmp2.crossVectors(tmp, Y).normalize();
    basePos.addScaledVector(tmp2, Math.sin(t * .27) * .05 * SCALE).addScaledVector(Y, Math.sin(t * .21) * .03 * SCALE);
    look.copy(m.C);
    fov += (memFov(m) - fov) * Math.min(1, dt * 2);
    // the light wanders among them
    const a = el * .5, amp = ease(seg(el, .4, 2.2));
    offs.set(Math.sin(a) * .4, .55 + Math.sin(a * 2) * .08, .35 + Math.cos(a) * .12).multiplyScalar(amp * SCALE).applyQuaternion(m.grp.quaternion);
    blob.position.copy(m.C).add(offs);
    if (S.queue !== null && el > 1.2) startTravel(S.queue);
    else if (el > dur){
      const n = mems.filter(Boolean).length;
      if (S.idx + 1 < n) startTravel(S.idx + 1);
      else if (n >= COUNT) startFinale();
      else S.t0 = t - dur + 1;               // wait for the next memory to finish loading
    }
  } else if (S.mode === 'finale'){
    // pull back: every memory now glows in the box
    const k = clamp(el / 4.5, 0, 1);
    basePos.copy(S.camCurve.getPoint(ease(k)));
    look.copy(S.look0).lerp(OVER.look, ease(k));
    // a slow drift around the box of memories
    offs.subVectors(basePos, OVER.look).applyAxisAngle(Y, Math.sin(el * .07) * .2 * ease(seg(el, 2, 5)));
    basePos.copy(OVER.look).add(offs);
    fov += (overFov() - fov) * Math.min(1, dt * 1.5);
    tmp.set(Math.sin(t * .35) * 1.6, .4 + Math.sin(t * .5) * .5, Math.cos(t * .35) * 1.8 + 1.5).add(CENTRE);
    blob.position.copy(S.blob0).lerp(tmp, ease(seg(el, 0, 5)));
    if (S.queue !== null && el > 1) startTravel(S.queue);
    else if (el > FINALE){ S.cycle++; startTravel(0); }
  }

  // apply look-around and zoom around the look target
  offs.subVectors(basePos, look).multiplyScalar(S.mode === 'travel' ? 1 : ctl.zoom);
  qy.setFromAxisAngle(Y, ctl.yaw); tmp.crossVectors(Y, offs).normalize(); if (tmp.lengthSq() < .1) tmp.copy(X);
  qx.setFromAxisAngle(tmp, ctl.pitch);
  offs.applyQuaternion(qx).applyQuaternion(qy);
  camera.position.copy(look).add(offs);
  camera.lookAt(look);
  if (Math.abs(camera.fov - fov) > .001){ camera.fov = fov; camera.updateProjectionMatrix(); }

  // the light itself
  const born = S.mode === 'intro' ? easeOut(seg(el, .3, 2.5)) : 1;
  // three bodies: integrate the gravity in small steps, sample their paths for the swirls
  const simDt = Math.min(dt, .05) * (REDUCE ? .5 : 1.15), SUB = 10;
  for (let k = 0; k < SUB; k++){
    tbStep(simDt / SUB); tbClock += simDt / SUB;
    if (tbClock - tbSample > .018){ tbSample = tbClock; for (let i = 0; i < 3; i++){ tbHist[i].unshift(TB.p[i].clone().multiplyScalar(BODY_K)); if (tbHist[i].length > TR) tbHist[i].pop(); } }
  }
  sys.rotation.set(.9 + Math.sin(t * .07) * .25, t * .06, .2 + Math.sin(t * .05) * .15);
  bodies.forEach((b, i) => b.position.copy(TB.p[i]).multiplyScalar(BODY_K));
  bodyU.uI.value = born * (1 + Math.sin(t * 5.3) * .03);
  for (let i = 0; i < 3; i++) for (let j = 0; j < TR; j++){
    const hp = tbHist[i][Math.min(j, tbHist[i].length - 1)] || bodies[i].position, o = (i * TR + j);
    trailPos[o * 3] = hp.x; trailPos[o * 3 + 1] = hp.y; trailPos[o * 3 + 2] = hp.z;
    trailA[o] = born * Math.pow(1 - j / TR, 1.5) * (j < tbHist[i].length ? 1 : 0);
  }
  swirlGeo.attributes.position.needsUpdate = true; swirlGeo.attributes.a.needsUpdate = true;
  swirlCore.material.uniforms.uPx.value = px; swirlHaze.material.uniforms.uPx.value = px;
  blobVel.subVectors(blob.position, blobPrev).divideScalar(Math.max(dt, 1e-3)); blobPrev.copy(blob.position);
  // embers
  embAcc += dt * (14 + Math.min(50, blobVel.length() * 12)) * born;
  while (embAcc >= 1){ embAcc -= 1; const e = EP[embNext]; embNext = (embNext + 1) % EMB;
    e.p.copy(bodies[embNext % 3].getWorldPosition(new V3())).add(new V3(Math.random() - .5, Math.random() - .5, Math.random() - .5).multiplyScalar(.05));
    e.v.set(Math.random() - .5, Math.random() - .3, Math.random() - .5).multiplyScalar(.35).addScaledVector(blobVel, -.12);
    e.life = 0; e.max = 1.4 + Math.random() * 2.4; }
  const ep = embGeo.attributes.position.array, ea = embGeo.attributes.a.array;
  EP.forEach((e, i) => {
    e.life += dt; e.v.multiplyScalar(1 - dt * .9); e.v.y += dt * .05;
    e.v.x += Math.sin(t * 1.3 + i) * dt * .05; e.v.z += Math.cos(t * 1.1 + i * .7) * dt * .05;
    e.p.addScaledVector(e.v, dt);
    ep[i * 3] = e.p.x; ep[i * 3 + 1] = e.p.y; ep[i * 3 + 2] = e.p.z;
    const k = e.life / e.max;
    ea[i] = k >= 1 ? 0 : born * (1 - k) * Math.min(1, e.life * 6) * (.55 + .45 * Math.sin(t * 9 + i * 3.7)) * (.5 + e.s);
  });
  embGeo.attributes.position.needsUpdate = true; embGeo.attributes.a.needsUpdate = true;
  embers.material.uniforms.uPx.value = px;
  // the lens sees the light
  tmp.copy(blob.position).project(camera);
  const onScr = tmp.z < 1 && Math.abs(tmp.x) < 1.25 && Math.abs(tmp.y) < 1.25;
  grade.uniforms.uBlob.value.set(tmp.x * .5 + .5, tmp.y * .5 + .5);
  const bdist = camera.position.distanceTo(blob.position);
  grade.uniforms.uBlobV.value += ((onScr ? born * clamp(2.2 - Math.max(Math.abs(tmp.x), Math.abs(tmp.y)) * 1.4, 0, 1) : 0) - grade.uniforms.uBlobV.value) * Math.min(1, dt * 6);
  grade.uniforms.uBlobS.value = clamp(4 / bdist, .1, 2);
  // depth of field: focus follows the story
  let fTarget, aTarget;
  const curClear = S.mode === 'hold' && mems[S.idx] ? mems[S.idx].U.uClear.value : 0;
  if (S.mode === 'hold'){ fTarget = camera.position.distanceTo(mems[S.idx].C); aTarget = .032 * (1 - curClear); }
  else if (S.mode === 'finale'){ fTarget = camera.position.distanceTo(OVER.look); aTarget = .005; }
  else { fTarget = bdist; aTarget = .05; }
  FOCUS_U.value += (fTarget - FOCUS_U.value) * Math.min(1, dt * 2.5);
  APER_U.value += (aTarget - APER_U.value) * Math.min(1, dt * 1.5);
  grade.uniforms.uGlass.value += ((1 - .7 * curClear) - grade.uniforms.uGlass.value) * Math.min(1, dt * 2);
  history.unshift(blob.position.clone()); if (history.length > TRAIL) history.pop();
  const tp = trailGeo.attributes.position.array, ta = trailGeo.attributes.a.array;
  const flying = S.mode === 'travel' && S.blobCurve;
  const kb = flying ? easeIO(clamp((t - S.t0) / S.dur, 0, 1)) : 0;
  for (let i = 0; i < TRAIL; i++){
    const h = flying ? S.blobCurve.getPoint(Math.max(0, kb - i * .0011)) : history[Math.min(i >> 1, history.length - 1)];
    const sw = i * .0009;
    tp[i * 3] = h.x + Math.sin(i * .7 + t * 2.0) * sw; tp[i * 3 + 1] = h.y + Math.cos(i * .5 + t * 1.7) * sw - i * .0008; tp[i * 3 + 2] = h.z;
    ta[i] = born * Math.pow(1 - i / TRAIL, 1.6) * (flying ? .55 : .2);
  }
  trailGeo.attributes.position.needsUpdate = true; trailGeo.attributes.a.needsUpdate = true;

  // memories
  for (const m of mems){ if (!m) continue;
    const U = m.U;
    U.uPx.value = px;
    U.uDust.value = 1.5 * easeOut(seg(t - m.born, 0, 3));
    if (m.levelT){ U.uLevel.value = m.levelFrom + (m.levelTo - m.levelFrom) * ease(seg(t - m.levelT, 0, m.levelTo > m.levelFrom ? 2.6 : 3)); }
    if (m.waveT > 0){
      const w = (t - m.waveT) / WAVE;
      U.uWaveR.value = w >= 1.6 ? 999 : (m.R + 1.2) * easeOut(clamp(w, 0, 1)) + Math.max(0, w - 1) * 6;
      U.uWaveA.value = w >= 1.6 ? 0 : 1 - ease(seg(w, .7, .5));
    }
    if (m.ripT > 0){
      const w = (t - m.ripT) / 2.6;
      U.uRipR.value = (m.R + .5) * easeOut(clamp(w, 0, 1)); U.uRipA.value = w > 1 ? 0 : (1 - w) * .9;
    }
    if (m.flatT) U.uFlat.value = m.flatFrom + (m.flatTo - m.flatFrom) * easeIO(seg(t - m.flatT, 0, m.flatD));
    if (m.clearT) U.uClear.value = m.clearFrom + (m.clearTo - m.clearFrom) * easeIO(seg(t - m.clearT, 0, m.clearD));
    m.clear.visible = U.uClear.value > .002; m.pts.material.visible = U.uClear.value < .998;
    m.pts.worldToLocal(U.uBlob.value.copy(blob.position));
    const bd = blob.position.distanceTo(m.C);
    U.uBlobA.value = clamp(1 - (bd - 1.2 * SCALE) / (3.5 * SCALE), 0, 1) * (m.revealed ? 1 : .6);
  }

  composer.render();
}
requestAnimationFrame(frame);
addEventListener('visibilitychange', () => { if (actx){ document.hidden ? actx.suspend() : actx.resume(); } });
window.__state = () => ({ cam: camera.position.toArray().map((v) => +v.toFixed(2)), fov: +camera.fov.toFixed(1), blob: blob.position.toArray().map((v) => +v.toFixed(2)), mode: S.mode, idx: S.idx, loaded: mems.filter(Boolean).length, revealed: mems.filter((m) => m && m.revealed).length });
window.__goTo = goTo;
window.__dbg = { mems, startFinale: () => { for (const m of mems) if (m){ m.revealed = true; m.waveT = .001; m.frac = 1; m.pts.geometry.setDrawRange(0, m.n); } startFinale(); } };
</script>
</body>
