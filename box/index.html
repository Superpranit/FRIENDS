<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Memory Box</title>
<style>
/* The whole page is the void. Icons only; no words on screen. */
:root{ --fluo:#7ff6e6; --line:rgba(200,255,245,.28); }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#e8fffb;overflow:hidden;overscroll-behavior:none;font-family:system-ui,sans-serif}
#stage{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100% !important;height:100% !important}
.top{position:fixed;right:0;top:0;z-index:5;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.35);color:#e8fffb;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:.75;transition:opacity .3s}
.icon-btn:hover{opacity:1}
.icon-btn svg{width:18px;height:18px}
.icon-btn:focus-visible{outline:2px solid var(--fluo);outline-offset:3px}
.hints{position:fixed;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:center;gap:34px;pointer-events:none;opacity:0;transition:opacity 1.4s}
.hints.on{opacity:.8}
.hints svg{width:30px;height:30px;stroke:#e8fffb;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(127,246,230,.6))}
.fail{position:fixed;inset:0;display:grid;place-items:center;color:#9fb;font-size:14px;padding:24px;text-align:center}
@media (prefers-reduced-motion: reduce){.hints{transition:none}}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage" role="img" aria-label="Four memories of friends floating in a dark void, lit one by one by a glowing light"></div>
<div class="top">
  <button id="snd" class="icon-btn" aria-label="Sound" aria-pressed="false">
    <svg id="sndOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
    <svg id="sndOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  </button>
</div>
<div class="hints" id="hints" aria-hidden="true">
  <!-- drag to look -->
  <svg viewBox="0 0 32 32"><path d="M8 16h16M8 16l3-3M8 16l3 3M24 16l-3-3M24 16l-3 3"/><circle cx="16" cy="16" r="2.2"/></svg>
  <!-- tap a memory -->
  <svg viewBox="0 0 32 32"><circle cx="16" cy="13" r="3"/><circle cx="16" cy="13" r="7.5" opacity=".55"/><path d="M16 21v6"/></svg>
</div>
<noscript><div class="fail">This memory needs JavaScript.</div></noscript>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = (id) => document.getElementById(id);
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const V3 = THREE.Vector3;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const seg = (t, a, d) => clamp((t - a) / d, 0, 1);
const ease = (x) => x * x * (3 - 2 * x);
const easeIO = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const now = () => performance.now() / 1000;

/* ===================== renderer ===================== */
const stage = $('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  stage.innerHTML = '<div class="fail">This device cannot show 3D right now.</div>';
  throw e;
}
const DPR = Math.min(devicePixelRatio || 1, 1.6);
renderer.setPixelRatio(DPR);
renderer.setClearColor(0x000000, 1);
renderer.toneMapping = THREE.NoToneMapping;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, .02, 400);
const FLUO = new THREE.Color(0x6ff7e4);           // the fluorescent light
const FLUO_LIN = new THREE.Vector3(FLUO.r, FLUO.g, FLUO.b);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), .55, .45, .82);
composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime; uniform vec2 uRes; varying vec2 vUv;
    void main(){
      vec2 d = vUv - .5; float r = dot(d, d);
      vec3 c = vec3(texture2D(tDiffuse, vUv - d * r * .02).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv + d * r * .02).b);
      c *= 1.0 - r * 1.1;                                     // vignette
      vec2 px = floor(vUv * uRes) + floor(fract(uTime * 7.13) * 64.0) * vec2(5.588, 3.17);
      float g = fract(52.9829189 * fract(dot(px, vec2(.06711056, .00583715))));   // stable at any resolution
      c += (g - .5) * .018;                                   // fine film grain
      gl_FragColor = vec4(max(c, 0.0), 1.0);
    }`
});
composer.addPass(grade);
composer.addPass(new OutputPass());

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h);
  bloom.resolution.set(w * DPR / 2, h * DPR / 2);
  grade.uniforms.uRes.value.set(w * DPR, h * DPR);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ===================== the void ===================== */
const NOISE = `
  float h3(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  float n3(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z); }
  float fbm(vec3 p){ float a = .5, s = 0.0; for (int i = 0; i < 4; i++){ s += a * n3(p); p = p * 2.03 + 1.7; a *= .5; } return s; }`;

const timeU = { value: 0 };
// a faint nebula, almost black, so the dark has depth
const nebula = new THREE.Mesh(new THREE.SphereGeometry(150, 32, 16), new THREE.ShaderMaterial({
  uniforms: { uTime: timeU }, side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform float uTime; varying vec3 vD; ${NOISE}
    void main(){ vec3 d = normalize(vD);
      float n = fbm(d * 2.4 + vec3(uTime * .004, 0.0, -uTime * .003));
      float m = fbm(d * 5.0 - 3.1);
      vec3 c = mix(vec3(.0006, .0009, .0025), vec3(.004, .010, .016), smoothstep(.45, .85, n));
      c += vec3(.006, .002, .012) * smoothstep(.55, .9, m) * .8;
      gl_FragColor = vec4(c, 1.0); }`
}));
scene.add(nebula);

// drifting dust motes everywhere in the void
const MOTES = 2600;
{
  const p = new Float32Array(MOTES * 3), s = new Float32Array(MOTES);
  for (let i = 0; i < MOTES; i++){ p[i * 3] = (Math.random() - .5) * 70; p[i * 3 + 1] = (Math.random() - .5) * 34; p[i * 3 + 2] = -55 + Math.random() * 80; s[i] = Math.random(); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('seed', new THREE.BufferAttribute(s, 1));
  const m = new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: { uTime: timeU, uPx: { value: 1 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `attribute float seed; uniform float uTime, uPx; varying float vA;
      void main(){ vec3 q = position; q.y += sin(uTime * .1 + seed * 40.0) * .4; q.x += sin(uTime * .07 + seed * 20.0) * .5;
        vec4 mv = modelViewMatrix * vec4(q, 1.0);
        vA = (.25 + .75 * seed) * (.55 + .45 * sin(uTime * (.6 + seed) + seed * 50.0)) * smoothstep(60.0, 8.0, -mv.z);
        gl_PointSize = clamp(uPx * .035 * (.4 + seed) / -mv.z, 0.0, 4.0); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `varying float vA; void main(){ vec2 c = gl_PointCoord - .5; float d = dot(c, c); if (d > .25) discard;
      gl_FragColor = vec4(vec3(.55, .8, .85) * smoothstep(.25, .0, d) * vA * .35, 1.0); }`
  }));
  m.frustumCulled = false; m.userData.isMotes = true; scene.add(m); scene.userData.motes = m;
}

/* ===================== the glowing light ===================== */
function glowTex(){
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.18, 'rgba(255,255,255,.75)'); r.addColorStop(.45, 'rgba(255,255,255,.18)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128); const t = new THREE.CanvasTexture(c); return t;
}
const GLOW = glowTex();
const sprite = (color, s, o) => { const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: o }));
  m.scale.setScalar(s); m.userData.s = s; m.userData.o = o; return m; };
const blob = new THREE.Group(); scene.add(blob);
const halo = sprite(new THREE.Color(0x3fe8d6), .62, .3);
const mid = sprite(new THREE.Color(0x8ffff0), .2, .85);
const core = sprite(new THREE.Color(0xffffff), .07, 1);
blob.add(halo, mid, core);
// sparks circling the light
const SPARKS = 46;
const sparkGeo = new THREE.BufferGeometry(); sparkGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SPARKS * 3), 3));
const sparkSeed = Array.from({ length: SPARKS }, () => [Math.random() * 6.28, .5 + Math.random() * 1.6, (Math.random() - .5) * 2, .06 + Math.random() * .2]);
const pointMat = (sizeK, color) => new THREE.ShaderMaterial({
  uniforms: { uPx: { value: 1 }, uK: { value: sizeK }, uCol: { value: color } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `attribute float a; uniform float uPx, uK; varying float vA;
    void main(){ vA = a; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = clamp(uPx * uK * (.3 + a) / -mv.z, 0.0, 40.0); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform vec3 uCol; varying float vA; void main(){ vec2 c = gl_PointCoord - .5; float d = dot(c, c); if (d > .25) discard;
    gl_FragColor = vec4(uCol * smoothstep(.25, .0, d) * vA, 1.0); }`
});
sparkGeo.setAttribute('a', new THREE.BufferAttribute(new Float32Array(SPARKS).fill(.8), 1));
const sparks = new THREE.Points(sparkGeo, pointMat(.008, new THREE.Vector3(.7, 1.3, 1.2)));
sparks.frustumCulled = false; scene.add(sparks);
// a comet trail behind the light
const TRAIL = 260;
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL * 3), 3));
trailGeo.setAttribute('a', new THREE.BufferAttribute(new Float32Array(TRAIL), 1));
const trail = new THREE.Points(trailGeo, pointMat(.022, new THREE.Vector3(.35, 1.0, .9)));
trail.frustumCulled = false; scene.add(trail);
const history = [];

/* ===================== memories ===================== */
// where each memory floats in the void (its people sit at C), and how it is turned
const LAYOUT = [
  { C: [-3.6, 5.6, -8], yaw: .36, pitch: .03, roll: .04 },      // mountain viewpoint, day (high up)
  { C: [3.9, 1.7, -12.4], yaw: -.42, pitch: -.04, roll: -.05 },  // misty hilltop
  { C: [-3.4, -2.3, -18.6], yaw: .28, pitch: .05, roll: .05 },   // party under the lights, night
  { C: [3.6, -6.1, -22.6], yaw: -.46, pitch: -.02, roll: -.04 }  // the street, late (deepest)
];
const SCALE = 1.9;                                               // each memory is a little larger than life
const CENTRE = LAYOUT.reduce((a, l) => a.add(new V3(...l.C)), new V3()).multiplyScalar(1 / LAYOUT.length);
// the whole box seen from the front: every memory turns (almost) toward this point
const OVER = { pos: CENTRE.clone().add(new V3(0, 1.2, 22)), look: CENTRE.clone() };

const pointVS = `
  uniform vec3 uLo, uHi, uWaveC, uRipC, uBlob, uFluo;
  uniform float uSmin, uSmax, uPx, uTime, uLevel, uDust, uWaveR, uWaveA, uRipR, uRipA, uBlobA, uFlat, uPlane;
  attribute float aS, aW;
  varying vec3 vC;
  float hsh(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  void main(){
    vec3 p = uLo + position * (uHi - uLo);
    float h = hsh(position * 613.0), h2 = hsh(position * 271.0 + 3.1), h3 = hsh(position * 997.0 + 7.7);
    vec3 rnd = vec3(h, h2, h3) - .5;
    float d = distance(p, uWaveC);
    float passed = 1.0 - smoothstep(uWaveR - .9, uWaveR, d);          // 1 once the light has reached it
    // before the light arrives, the memory is loose dust drifting in the dark
    vec3 drift = vec3(sin(uTime * .21 + h * 40.0), cos(uTime * .17 + h2 * 31.0), sin(uTime * .13 + h3 * 17.0));
    vec3 scat = normalize(rnd + 1e-4) * (.18 + 1.1 * h2 * h2) + drift * .12;
    float settle = passed * passed * (3.0 - 2.0 * passed);
    // resting memories fold into a glowing photograph (projected along the original camera's rays)
    float kf = uPlane / max(-p.z, .3);
    vec3 card = vec3(p.xy * kf * 1.55, -uPlane + (p.z + uPlane) * .04);
    vec3 pr = mix(p, card, uFlat);
    vec3 q = pr + scat * (1.0 - settle);
    vec3 c = pow(color, vec3(2.2));
    float lum = dot(c, vec3(.2126, .7152, .0722));
    vec3 dim = (vec3(lum) * .7 + c * .3) * vec3(.45, .75, 1.0) * uDust * (.6 + .4 * sin(uTime * .8 + h * 30.0));
    vec3 col = mix(dim, c * uLevel, settle);
    float rim = exp(-pow((d - uWaveR) / .22, 2.0)) * uWaveA;          // the bright front of the light
    float rip = exp(-pow((d - uRipR) / .2, 2.0)) * uRipA;
    float bd = distance(q, uBlob);
    float bl = uBlobA / (1.0 + bd * bd * 16.0);
    col += c * bl * .55 + uFluo * (rim * (.45 + .5 * h) + rip * .4 + bl * .05 * settle);
    col *= aW;                                                         // soft, ragged edges of the memory
    vC = col;
    vec4 mv = modelViewMatrix * vec4(q, 1.0);
    float sz = exp(uSmin + aS * (uSmax - uSmin)) * mix(.55, 1.0, settle) * (1.0 + rim * .8) * mix(1.0, kf * 1.55, uFlat);
    float ps = sz * length(modelViewMatrix[0].xyz) * uPx / -mv.z;
    vC *= clamp(ps / 1.2, .5, 1.0);                                   // far away: fainter, never sparkly
    gl_PointSize = clamp(max(ps, 1.6), 0.0, 30.0);
    gl_Position = projectionMatrix * mv;
  }`;
const pointFS = `varying vec3 vC;
  void main(){ vec2 c = gl_PointCoord - .5; float d = dot(c, c); if (d > .25) discard; gl_FragColor = vec4(vC * (1.0 - d * .5), 1.0); }`;

const mems = [];
function makeMemory(meta, buf, i){
  const L = LAYOUT[i % LAYOUT.length];
  const n = meta.n;
  const ib16 = new THREE.InterleavedBuffer(new Uint16Array(buf, 0, n * 6), 6);
  const ib8 = new THREE.InterleavedBuffer(new Uint8Array(buf, 0, n * 12), 12);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.InterleavedBufferAttribute(ib16, 3, 0, true));
  g.setAttribute('color', new THREE.InterleavedBufferAttribute(ib8, 3, 6, true));
  g.setAttribute('aS', new THREE.InterleavedBufferAttribute(ib8, 1, 9, true));
  g.setAttribute('aW', new THREE.InterleavedBufferAttribute(ib8, 1, 10, true));
  const focus = new V3(...meta.focus);
  const lo = new V3(...meta.lo), hi = new V3(...meta.hi);
  let R = 0; for (const x of [lo.x, hi.x]) for (const y of [lo.y, hi.y]) for (const z of [lo.z, hi.z]) R = Math.max(R, focus.distanceTo(new V3(x, y, z)));
  const U = {
    uLo: { value: lo }, uHi: { value: hi }, uSmin: { value: meta.smin }, uSmax: { value: meta.smax },
    uPx: { value: 1 }, uTime: timeU, uLevel: { value: 0 }, uDust: { value: 0 }, uFluo: { value: FLUO_LIN },
    uWaveC: { value: focus.clone() }, uWaveR: { value: 0 }, uWaveA: { value: 0 },
    uRipC: { value: focus.clone() }, uRipR: { value: 0 }, uRipA: { value: 0 },
    uBlob: { value: new V3(0, 0, 999) }, uBlobA: { value: 0 }, uFlat: { value: 0 }, uPlane: { value: -meta.focus[2] }
  };
  const pts = new THREE.Points(g, new THREE.ShaderMaterial({ uniforms: U, vertexShader: pointVS, fragmentShader: pointFS, vertexColors: true }));
  pts.frustumCulled = false;
  pts.position.copy(focus).multiplyScalar(-1);          // the people sit at the group's centre
  const grp = new THREE.Group();
  grp.position.set(...L.C);
  grp.lookAt(OVER.pos); grp.rotateZ(L.roll); grp.rotateY(L.yaw * .12); grp.scale.setScalar(SCALE);
  grp.add(pts); scene.add(grp); grp.updateMatrixWorld(true);
  const C = grp.position.clone();
  const view = grp.localToWorld(focus.clone().multiplyScalar(-1));    // where the photo was taken from
  const hfov = 2 * Math.atan(meta.W / 2 / meta.f), vfov = 2 * Math.atan(meta.H / 2 / meta.f);
  // the corners of the resting photo card, in the world (the soft edge trims about 15%)
  const plane = -meta.focus[2], corners = [[.08, .08], [.92, .08], [.08, .92], [.92, .92]].map(([u, v]) =>
    pts.localToWorld(new V3((u * meta.W - meta.cx) / meta.f * plane * 1.55, -(v * meta.H - meta.cy) / meta.f * plane * 1.55, -plane)));
  const m = { i, meta, grp, pts, U, C, view, R, hfov, vfov, n, corners, revealed: false, level: 0, levelT: 0, waveT: -1, ripT: -1, frac: .4, born: now(), flatFrom: 0, flatTo: 0, flatT: 0, flatD: 1 };
  g.setDrawRange(0, Math.floor(n * m.frac));
  mems[i] = m;
  return m;
}

async function loadAll(){
  const box = await fetch('box.json').then((r) => r.json());
  for (let i = 0; i < box.memories.length; i++){
    const meta = box.memories[i];
    const buf = await fetch(meta.file).then((r) => { if (!r.ok) throw new Error(meta.file); return r.arrayBuffer(); });
    makeMemory(meta, buf, i);
  }
  return box.memories.length;
}
let COUNT = 4;
loadAll().then((n) => { COUNT = n; }).catch((e) => { console.error(e); });

/* ===================== sound (made in the browser) ===================== */
let actx = null, master = null, soundOn = false;
function audioStart(){
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = actx.createGain(); master.gain.value = 0; master.connect(actx.destination);
  // a low, slowly breathing pad
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = .5; lp.connect(master);
  const lfo = actx.createOscillator(), lfoG = actx.createGain(); lfo.frequency.value = .05; lfoG.gain.value = 240; lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
  [[55, .05, 'sine'], [82.41, .03, 'triangle'], [110.3, .02, 'sine'], [164.8, .012, 'sine']].forEach(([f, g, type], k) => {
    const o = actx.createOscillator(), gg = actx.createGain(); o.type = type; o.frequency.value = f; o.detune.value = (k - 1.5) * 4; gg.gain.value = g; o.connect(gg); gg.connect(lp); o.start();
  });
  setSound(true);
}
function setSound(on){
  soundOn = on;
  $('sndOn').style.display = on ? '' : 'none'; $('sndOff').style.display = on ? 'none' : '';
  $('snd').setAttribute('aria-pressed', on ? 'true' : 'false');
  if (master) master.gain.setTargetAtTime(on ? .9 : 0, actx.currentTime, .6);
}
function noiseBuf(){
  const len = actx.sampleRate * 2, b = actx.createBuffer(1, len, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; return b;
}
let NB = null;
function whoosh(dur){
  if (!actx || !soundOn) return;
  NB = NB || noiseBuf();
  const t = actx.currentTime, s = actx.createBufferSource(); s.buffer = NB; s.loop = true;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.5;
  bp.frequency.setValueAtTime(260, t); bp.frequency.exponentialRampToValueAtTime(1500, t + dur * .55); bp.frequency.exponentialRampToValueAtTime(300, t + dur);
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.09, t + dur * .5); g.gain.linearRampToValueAtTime(0, t + dur);
  s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .1);
}
function chime(f0, big){
  if (!actx || !soundOn) return;
  const t = actx.currentTime, out = actx.createGain(); out.gain.value = big ? .08 : .05; out.connect(master);
  const parts = big ? [[1, 1, 3.2], [1.5, .5, 2.6], [2, .35, 2.2], [3.01, .16, 1.4], [4.2, .08, 1.0]] : [[1, 1, 2.2], [2, .3, 1.4], [3.01, .12, 1.0]];
  parts.forEach(([m, g0, dur], k) => {
    const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = f0 * m;
    const t0 = t + k * .06; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(g0, t0 + .012); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + dur + .1);
  });
  if (big){ // a soft swell under the bells
    const o = actx.createOscillator(), g = actx.createGain(); o.type = 'triangle'; o.frequency.value = f0 / 4;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.05, t + 1.4); g.gain.exponentialRampToValueAtTime(.0001, t + 6);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 6.1);
  }
}
$('snd').addEventListener('click', (e) => { e.stopPropagation(); if (!actx){ audioStart(); return; } setSound(!soundOn); });

/* ===================== the journey ===================== */
const NOTES = [523.25, 587.33, 659.25, 783.99];
const INTRO = REDUCE ? 2 : 4.6, HOLD = REDUCE ? 7 : 10, REVISIT = REDUCE ? 5 : 7.5, FINALE = REDUCE ? 8 : 15, WAVE = REDUCE ? 2.2 : 3.6;
const S = { mode: 'intro', t0: now(), idx: -1, queue: null, cycle: 0 };
const look = OVER.look.clone();
camera.position.copy(OVER.pos).add(new V3(0, 1.5, 9));
camera.fov = overFov(); camera.updateProjectionMatrix();
camera.lookAt(look);
blob.position.copy(CENTRE).add(new V3(0, .2, 2));
const blobStart = blob.position.clone();

function overFov(){
  // widest angle any memory needs, seen from the overview point (near ones look bigger)
  const fwd = OVER.look.clone().sub(OVER.pos).normalize(), right = new V3().crossVectors(fwd, new V3(0, 1, 0)).normalize(), upv = new V3().crossVectors(right, fwd);
  let th = 0, tv = 0;
  const loaded = mems.filter(Boolean);
  if (loaded.length) for (const m of loaded) for (const c of m.corners){ const d = c.clone().sub(OVER.pos), z = d.dot(fwd);
    th = Math.max(th, Math.abs(d.dot(right)) / z); tv = Math.max(tv, Math.abs(d.dot(upv)) / z); }
  else for (const l of LAYOUT){ const d = new V3(...l.C).sub(OVER.pos), z = d.dot(fwd), r = 2.0 * SCALE;
    th = Math.max(th, (Math.abs(d.dot(right)) + r) / z); tv = Math.max(tv, (Math.abs(d.dot(upv)) + r * .75) / z); }
  const vf = 2 * Math.atan(Math.max(tv, th / camera.aspect) * 1.12) * 1.1;
  return clamp(THREE.MathUtils.radToDeg(vf), 34, 82);
}
function memFov(m){
  const hf = m.hfov * 1.2;
  let vf = 2 * Math.atan(Math.tan(hf / 2) / camera.aspect);
  vf = clamp(vf, m.vfov * 1.32, THREE.MathUtils.degToRad(70));
  return THREE.MathUtils.radToDeg(vf);
}

function setFlat(m, to, d){ m.flatFrom = m.U.uFlat.value; m.flatTo = to; m.flatT = now(); m.flatD = d; }
function startTravel(i){
  const m = mems[i]; if (!m) return false;
  const prev = mems[S.idx];
  if (prev && prev !== m){ prev.levelFrom = prev.U.uLevel.value; prev.levelTo = .5; prev.levelT = now(); setFlat(prev, .92, 5); }
  S.mode = 'travel'; S.t0 = now(); S.idx = i; S.queue = null;
  const P0 = blob.position.clone();
  const dirIn = m.C.clone().sub(m.view).normalize();
  const up = new V3(0, 1, 0);
  const side = new V3().crossVectors(dirIn, up).normalize();
  const approach = m.C.clone().addScaledVector(dirIn, -1.8 * SCALE).addScaledVector(up, .35 * SCALE);
  const midP = P0.clone().lerp(approach, .5).addScaledVector(up, 2 + Math.random() * 1.6).addScaledVector(side, (Math.random() - .5) * 5);
  S.blobCurve = new THREE.CatmullRomCurve3([P0, midP, approach, m.C.clone()], false, 'centripetal');
  const Q0 = camera.position.clone();
  const camMid = midP.clone().addScaledVector(dirIn, -4.5).addScaledVector(up, 1.2);
  const camApp = m.view.clone().addScaledVector(dirIn, -1.6 * SCALE).addScaledVector(up, .25 * SCALE);
  S.camCurve = new THREE.CatmullRomCurve3([Q0, camMid, camApp, m.view.clone()], false, 'centripetal');
  S.look0 = look.clone(); S.fov0 = camera.fov; S.fov1 = memFov(m);
  S.dur = REDUCE ? 3 : clamp(P0.distanceTo(m.C) * .3, 4.4, 7.2);
  ctl.yaw *= .3; ctl.pitch *= .3;
  whoosh(S.dur);
  return true;
}
function arrive(){
  const m = mems[S.idx];
  S.mode = 'hold'; S.t0 = now();
  if (!m.revealed){ m.revealed = true; m.waveT = now(); m.frac = 1; m.pts.geometry.setDrawRange(0, m.n); chime(NOTES[S.idx % 4], true); }
  else { m.ripT = now(); chime(NOTES[S.idx % 4] * 2, false); }
  m.levelFrom = m.U.uLevel.value; m.levelTo = 1; m.levelT = now(); setFlat(m, 0, 1.6);
  if (!S.hinted){ S.hinted = true; setTimeout(() => $('hints').classList.add('on'), 2600); setTimeout(() => $('hints').classList.remove('on'), 9000); }
}
function startFinale(){
  const prev = mems[S.idx];
  S.mode = 'finale'; S.t0 = now(); S.idx = -1;
  S.camCurve = new THREE.CatmullRomCurve3([camera.position.clone(), camera.position.clone().lerp(OVER.pos, .5).add(new V3(0, 2.5, 4)), OVER.pos.clone()], false, 'centripetal');
  S.look0 = look.clone(); S.fov0 = camera.fov;
  S.blob0 = blob.position.clone();
  for (const m of mems) if (m){ m.levelFrom = m.U.uLevel.value; m.levelTo = m.revealed ? .9 : 0; m.levelT = now(); if (m.revealed) setFlat(m, .92, 4); }
  whoosh(4);
}
function goTo(i){
  if (i === S.idx && S.mode === 'hold'){ const m = mems[i]; m.ripT = now(); chime(NOTES[i % 4] * 1.5, false); return; }
  if (S.mode === 'hold' && now() - S.t0 < 1.2){ S.queue = i; return; }
  startTravel(i);
}

/* ===================== touch: look, zoom, tap ===================== */
const ctl = { yaw: 0, pitch: 0, zoom: 1, lastInput: -99 };
const ptrs = new Map(); let downAt = null, moved = 0, pinch0 = 0, zoom0 = 1;
stage.addEventListener('pointerdown', (e) => {
  audioStart();
  stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1){ downAt = { x: e.clientX, y: e.clientY, t: now() }; moved = 0; }
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = ctl.zoom; }
});
stage.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1){
    moved += Math.abs(dx) + Math.abs(dy);
    const k = 2.4 / Math.min(innerWidth, innerHeight);
    ctl.yaw -= dx * k; ctl.pitch += dy * k * .7; ctl.lastInput = now();
  } else if (ptrs.size === 2){
    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch0 > 0) ctl.zoom = clamp(zoom0 * pinch0 / d, .6, 1.35); ctl.lastInput = now(); moved += 99;
  }
});
const endPtr = (e) => {
  ptrs.delete(e.pointerId);
  if (ptrs.size === 0 && downAt && moved < 12 && now() - downAt.t < .5) tap(e.clientX, e.clientY);
  if (ptrs.size === 0) downAt = null;
};
stage.addEventListener('pointerup', endPtr); stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('wheel', (e) => { e.preventDefault(); ctl.zoom = clamp(ctl.zoom * (1 + e.deltaY * .0012), .6, 1.35); ctl.lastInput = now(); }, { passive: false });
addEventListener('keydown', (e) => { if (e.key === 'ArrowRight' || e.key === ' '){ const n = mems.filter(Boolean).length; if (n) goTo(((S.idx < 0 ? -1 : S.idx) + 1) % n); } });

function tap(x, y){
  const v = new V3(); let best = -1, bd = 1e9;
  for (const m of mems){ if (!m) continue;
    v.copy(m.C).project(camera); if (v.z > 1) continue;
    const sx = (v.x * .5 + .5) * innerWidth, sy = (-v.y * .5 + .5) * innerHeight;
    const d = Math.hypot(sx - x, sy - y); if (d < bd){ bd = d; best = m.i; } }
  if (best >= 0 && bd < Math.max(innerWidth, innerHeight) * .32) goTo(best);
}

/* ===================== frame loop ===================== */
const tmp = new V3(), tmp2 = new V3(), offs = new V3(), qy = new THREE.Quaternion(), qx = new THREE.Quaternion(), X = new V3(1, 0, 0), Y = new V3(0, 1, 0);
let last = now();
function frame(){
  requestAnimationFrame(frame);
  const t = now(), dt = Math.min(.05, t - last); last = t;
  timeU.value = t; grade.uniforms.uTime.value = t;
  const px = camera.projectionMatrix.elements[5] * renderer.domElement.height * .5;
  scene.userData.motes.material.uniforms.uPx.value = px;
  sparks.material.uniforms.uPx.value = px; trail.material.uniforms.uPx.value = px;

  // user look-around eases back when left alone
  const idle = t - ctl.lastInput > 2.5;
  const LIM = S.mode === 'finale' || S.mode === 'intro' ? { y: 1.1, p: .45 } : { y: .32, p: .16 };
  ctl.yaw = clamp(ctl.yaw, -LIM.y, LIM.y); ctl.pitch = clamp(ctl.pitch, -LIM.p, LIM.p);
  if (idle){ ctl.yaw *= 1 - dt * .5; ctl.pitch *= 1 - dt * .5; ctl.zoom += (1 - ctl.zoom) * dt * .4; }

  const el = t - S.t0;
  let fov = camera.fov;
  const basePos = new V3();
  if (S.mode === 'intro'){
    // the light is born in the dark
    const k = easeOut(seg(el, 0, INTRO));
    basePos.copy(OVER.pos).add(new V3(0, 1.5, 9).multiplyScalar(1 - k));
    look.copy(OVER.look).lerp(blobStart, .25 * k);
    blob.position.copy(blobStart).add(new V3(0, Math.sin(t * .8) * .08, 0));
    fov += (overFov() - fov) * Math.min(1, dt * 2);
    if (el > INTRO && mems[0]) startTravel(0);
  } else if (S.mode === 'travel'){
    const m = mems[S.idx], k = clamp(el / S.dur, 0, 1);
    const kb = easeIO(k), kc = ease(ease(k) * .85 + k * .15);
    blob.position.copy(S.blobCurve.getPoint(kb));
    basePos.copy(S.camCurve.getPoint(kc));
    tmp.copy(S.look0).lerp(blob.position, ease(seg(k, 0, .3)));
    look.copy(tmp).lerp(m.C, ease(seg(k, .55, .45)));
    fov = S.fov0 + (Math.max(S.fov1, 46) - S.fov0) * ease(seg(k, 0, .4));
    fov += (S.fov1 - fov) * ease(seg(k, .6, .4));
    if (k >= 1) arrive();
  } else if (S.mode === 'hold'){
    const m = mems[S.idx];
    const dur = m.waveT > 0 && t - m.waveT < HOLD + 1 ? HOLD : REVISIT;
    // a slow push in toward the friends, breathing a little
    const k = easeOut(seg(el, 0, dur));
    basePos.copy(m.view).lerp(m.C, .1 * k);
    tmp.subVectors(m.C, m.view).normalize(); tmp2.crossVectors(tmp, Y).normalize();
    basePos.addScaledVector(tmp2, Math.sin(t * .27) * .05 * SCALE).addScaledVector(Y, Math.sin(t * .21) * .03 * SCALE);
    look.copy(m.C);
    fov += (memFov(m) - fov) * Math.min(1, dt * 2);
    // the light wanders among them
    const a = el * .5, amp = ease(seg(el, .4, 2.2));
    offs.set(Math.sin(a) * .62, .22 + Math.sin(a * 2) * .14, Math.cos(a) * .28 - .05).multiplyScalar(amp * SCALE).applyQuaternion(m.grp.quaternion);
    blob.position.copy(m.C).add(offs);
    if (S.queue !== null && el > 1.2) startTravel(S.queue);
    else if (el > dur){
      const n = mems.filter(Boolean).length;
      if (S.idx + 1 < n) startTravel(S.idx + 1);
      else if (n >= COUNT) startFinale();
      else S.t0 = t - dur + 1;               // wait for the next memory to finish loading
    }
  } else if (S.mode === 'finale'){
    // pull back: every memory now glows in the box
    const k = clamp(el / 4.5, 0, 1);
    basePos.copy(S.camCurve.getPoint(ease(k)));
    look.copy(S.look0).lerp(OVER.look, ease(k));
    // a slow drift around the box of memories
    offs.subVectors(basePos, OVER.look).applyAxisAngle(Y, Math.sin(el * .07) * .2 * ease(seg(el, 2, 5)));
    basePos.copy(OVER.look).add(offs);
    fov += (overFov() - fov) * Math.min(1, dt * 1.5);
    tmp.set(Math.sin(t * .35) * 1.6, .4 + Math.sin(t * .5) * .5, Math.cos(t * .35) * 1.8 + 1.5).add(CENTRE);
    blob.position.copy(S.blob0).lerp(tmp, ease(seg(el, 0, 5)));
    if (S.queue !== null && el > 1) startTravel(S.queue);
    else if (el > FINALE){ S.cycle++; startTravel(0); }
  }

  // apply look-around and zoom around the look target
  offs.subVectors(basePos, look).multiplyScalar(S.mode === 'travel' ? 1 : ctl.zoom);
  qy.setFromAxisAngle(Y, ctl.yaw); tmp.crossVectors(Y, offs).normalize(); if (tmp.lengthSq() < .1) tmp.copy(X);
  qx.setFromAxisAngle(tmp, ctl.pitch);
  offs.applyQuaternion(qx).applyQuaternion(qy);
  camera.position.copy(look).add(offs);
  camera.lookAt(look);
  if (Math.abs(camera.fov - fov) > .001){ camera.fov = fov; camera.updateProjectionMatrix(); }

  // the light itself
  const pulse = 1 + Math.sin(t * 3.1) * .06 + Math.sin(t * 7.7) * .03;
  const born = S.mode === 'intro' ? easeOut(seg(el, .3, 2.5)) : 1;
  halo.scale.setScalar(halo.userData.s * pulse * born); mid.scale.setScalar(mid.userData.s * pulse * born); core.scale.setScalar(core.userData.s * (1 + Math.sin(t * 11) * .05) * born);
  halo.material.opacity = halo.userData.o * born; mid.material.opacity = mid.userData.o * born; core.material.opacity = born;
  const sp = sparkGeo.attributes.position.array, sa = sparkGeo.attributes.a.array;
  sparkSeed.forEach(([ph, sp0, tilt, r], i) => {
    const a = ph + t * sp0;
    sp[i * 3] = blob.position.x + Math.cos(a) * r; sp[i * 3 + 1] = blob.position.y + Math.sin(a * 1.3) * r * .5 + tilt * .05; sp[i * 3 + 2] = blob.position.z + Math.sin(a) * r;
    sa[i] = born * (.4 + .6 * Math.abs(Math.sin(t * 2 + i)));
  });
  sparkGeo.attributes.position.needsUpdate = true; sparkGeo.attributes.a.needsUpdate = true;
  history.unshift(blob.position.clone()); if (history.length > TRAIL) history.pop();
  const tp = trailGeo.attributes.position.array, ta = trailGeo.attributes.a.array;
  const flying = S.mode === 'travel' && S.blobCurve;
  const kb = flying ? easeIO(clamp((t - S.t0) / S.dur, 0, 1)) : 0;
  for (let i = 0; i < TRAIL; i++){
    const h = flying ? S.blobCurve.getPoint(Math.max(0, kb - i * .0011)) : history[Math.min(i >> 1, history.length - 1)];
    const sw = i * .0009;
    tp[i * 3] = h.x + Math.sin(i * .7 + t * 2.0) * sw; tp[i * 3 + 1] = h.y + Math.cos(i * .5 + t * 1.7) * sw - i * .0008; tp[i * 3 + 2] = h.z;
    ta[i] = born * Math.pow(1 - i / TRAIL, 1.4) * (flying ? .7 : .35);
  }
  trailGeo.attributes.position.needsUpdate = true; trailGeo.attributes.a.needsUpdate = true;

  // memories
  for (const m of mems){ if (!m) continue;
    const U = m.U;
    U.uPx.value = px;
    U.uDust.value = .55 * easeOut(seg(t - m.born, 0, 3));
    if (m.levelT){ U.uLevel.value = m.levelFrom + (m.levelTo - m.levelFrom) * ease(seg(t - m.levelT, 0, m.levelTo > m.levelFrom ? 2.6 : 3)); }
    if (m.waveT > 0){
      const w = (t - m.waveT) / WAVE;
      U.uWaveR.value = w >= 1.6 ? 999 : (m.R + 1.2) * easeOut(clamp(w, 0, 1)) + Math.max(0, w - 1) * 6;
      U.uWaveA.value = w >= 1.6 ? 0 : 1 - ease(seg(w, .7, .5));
    }
    if (m.ripT > 0){
      const w = (t - m.ripT) / 2.6;
      U.uRipR.value = (m.R + .5) * easeOut(clamp(w, 0, 1)); U.uRipA.value = w > 1 ? 0 : (1 - w) * .9;
    }
    if (m.flatT) U.uFlat.value = m.flatFrom + (m.flatTo - m.flatFrom) * easeIO(seg(t - m.flatT, 0, m.flatD));
    m.pts.worldToLocal(U.uBlob.value.copy(blob.position));
    const bd = blob.position.distanceTo(m.C);
    U.uBlobA.value = clamp(1 - (bd - 1.2 * SCALE) / (3.5 * SCALE), 0, 1) * (m.revealed ? 1 : .6);
  }

  composer.render();
}
requestAnimationFrame(frame);
addEventListener('visibilitychange', () => { if (actx){ document.hidden ? actx.suspend() : actx.resume(); } });
window.__state = () => ({ cam: camera.position.toArray().map((v) => +v.toFixed(2)), fov: +camera.fov.toFixed(1), blob: blob.position.toArray().map((v) => +v.toFixed(2)), mode: S.mode, idx: S.idx, loaded: mems.filter(Boolean).length, revealed: mems.filter((m) => m && m.revealed).length });
window.__goTo = goTo;
window.__dbg = { mems, startFinale: () => { for (const m of mems) if (m){ m.revealed = true; m.waveT = .001; m.frac = 1; m.pts.geometry.setDrawRange(0, m.n); } startFinale(); } };
</script>
