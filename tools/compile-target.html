<!doctype html><html lang="en"><meta charset="utf-8"><title>Memory Box target compiler</title><style>body{background:#15231f;color:#edeede;font:16px system-ui;padding:50px;max-width:700px}button{padding:14px 20px;margin:20px 0}img{width:180px;display:block}a{color:inherit}</style><h1>Compile the print</h1><p>Run this after preparing the final QR poster. Everything stays in this browser.</p><img id="target" src="../memory/memory-target.jpg"><button id="compile">Compile target</button><p id="status">Ready</p><script type="module" src="../node_modules/mind-ar/dist/mindar-image.prod.js"></script><script>
window.compileTarget=async()=>{const img=document.getElementById('target');await img.decode();const compiler=new window.MINDAR.IMAGE.Compiler();await compiler.compileImageTargets([img],p=>document.getElementById('status').textContent=Math.round(p)+'%');const bytes=await compiler.exportData();window.compiledBytes=Array.from(new Uint8Array(bytes));document.getElementById('status').textContent='Complete';return window.compiledBytes};document.getElementById('compile').onclick=async()=>{const bytes=await compileTarget();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([new Uint8Array(bytes)]));a.download='targets.mind';a.textContent='Download targets.mind — place it in memory/';document.body.append(a);a.click()};</script></html>
